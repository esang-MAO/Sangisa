[project]
name = "sangisa"
version = "0.1.0"
description = "Take a song apart and turn it into a ready-to-play sample pack."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "librosa>=0.10.2",
    "pydantic>=2.6",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "segno>=1.6",
]

[project.optional-dependencies]
# Stem separation pulls in PyTorch. Use `separation` on CPU / Apple Silicon,
# `separation-gpu` on NVIDIA machines.
separation = ["audio-separator[cpu]>=0.30"]
separation-gpu = ["audio-separator[gpu]>=0.30"]

[project.scripts]
sangisa = "sangisa.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/sangisa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 120
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
