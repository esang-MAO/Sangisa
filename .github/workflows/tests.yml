name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4  # runs the in-browser engine's parity tests
        with:
          node-version: 22
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: uv sync --locked
      - run: uv run ruff check backend tests scripts
      - run: uv run pytest -q
